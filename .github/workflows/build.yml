# Builds against the PUBLISHED agent contract.
name: Build
run-name: "${{ github.workflow }} · ${{ github.ref_name }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}"

# A push that only touches documentation builds nothing.
on:
    push:
        branches: ['**']
        # A release: v<version>, built and published to the 'releases' channel. Paths are not filtered for a tag.
        tags: ['v*']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**']
    pull_request:
        branches: ['**']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**']
    workflow_dispatch:

# Read by every Maven call, the pinned-jdk action's too. On a tag -Dporelo.release: nothing from Central's
# snapshots and nothing asked for again, so a release is built from releases only. Elsewhere -U: Maven asks
# for a newer snapshot once a day, and a cache restored the day Porelo publishes would keep yesterday's.
env:
    MAVEN_ARGS: ${{ startsWith(github.ref, 'refs/tags/v') && '-Dporelo.release' || '-U' }}

# Read-only: nothing in this workflow writes to the repository with its token.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    build:
        name: Build and unit tests
        # Pinned, not 'ubuntu-latest'.
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # -s settings.xml declares the snapshot repository the agent contract is resolved from, and keeps.
            - name: Build and unit tests
              run: ./mvnw -B -s settings.xml verify

            # Porelo's release tool and the machine tooling, resolved once for every step that calls them.
            - name: Resolve the release and machine tooling
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            # A bump that forgets the digest builds, tests and packages green, and fails at an image build on.
            - name: The pin agrees everywhere it is written
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-pin

            # What every workflow step runs is pinned, and Dependabot moves the pins: the shared rule, refused
            # here when broken - a tag, a version-name JDK action, a pin without its exact release.
            - name: Every workflow step is pinned
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-actions

            # The packages are what an operator installs, so a build that has not produced them has not proved.
            # Not -DskipTests: that also skips NativeLinkageCheck and PackageVersionCheck, the tests that
            # need the binary and the packages it is packed into.
            - name: Native binary and packages
              run: ./mvnw -B -s settings.xml -Pnative,dist verify
                  -Dagent.snapshot.run=${{ github.run_number }}

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      target/*.deb
                      target/*.rpm
                      target/*.cdx.json
                  if-no-files-found: error

            # Publishing only from main, as a snapshot, and from a tag v<version>, as a release once every leg passed.
            - name: Not publishing
              if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
              # The runner's own variables rather than expressions, so a branch's name never becomes shell.
              run: |
                  echo "Not publishing. This run is '$GITHUB_EVENT_NAME' on '$GITHUB_REF',"
                  echo "and only a push to main or a tag v<version> publishes. The packages were built and tested here"
                  echo "and are attached to this run as artifacts; nothing reached Artifactory, so"
                  echo "'apt' will still offer whatever was published last."

            # A tag publishes a release, everything else a snapshot. A release is refused unless the tag is exactly
            # 'v' plus the version it carries and Porelo is a release too, and a version is never both at once.
            - name: Which channel
              id: channel
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  PORELO="$(sed -n 's|^        <porelo.version>\(.*\)</porelo.version>$|\1|p' pom.xml | head -1)"
                  [ -n "$PORELO" ] || { echo "::error::no porelo.version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      case "$PORELO" in
                          *-SNAPSHOT) echo "::error::porelo.version $PORELO is a snapshot; a release is built against a released Porelo"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            # A release depends only on releases: every -SNAPSHOT in the effective pom - dependencies, the imported
            # BOM, plugins and their dependencies such as porelo-release, inactive profiles too - refuses the tag.
            - name: A release depends only on releases
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  ./mvnw -B -s settings.xml help:effective-pom -Doutput=target/effective-pom.xml
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-releases target/effective-pom.xml \
                      --requires org.fuin.porelo:porelo-release

            # The action publishes build-info by itself at the end of the workflow.
            - uses: jfrog/setup-jfrog-cli@1e584506871998c267b7c100c02628a5b9c81db6 # v5.3.0
              with:
                  disable-auto-build-publish: true
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

            # The same two repositories Porelo itself publishes to.
            - name: Publish the packages
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eux
                  # A published release is never replaced, as on Central. Fetched to a file, so an index that
                  # cannot be read stops the release rather than reading as "not published".
                  if [ "$CHANNEL" = releases ]; then
                      curl -sfL -o target/published-index "${JF_URL}/artifactory/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                          || { echo "::error::the release index could not be read, so whether this release is published is unknown"; exit 1; }
                      if grep -qF "Filename: pool/main/p/porelo-agent-claude/$(basename target/*.deb)" target/published-index; then
                          echo "::error::this release is published already"; exit 1
                      fi
                  fi
                  # --flat, or the source directory travels and the package lands away from its siblings.
                  jf rt upload "target/*.deb" "porelo-dist-deb/pool/main/p/porelo-agent-claude/" \
                      --flat=true \
                      --target-props="deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  jf rt upload "target/*.rpm" "porelo-dist-rpm/${CHANNEL}/" --flat=true

                  # The bill beside the package, readable without installing.
                  jf rt upload "target/*.cdx.json" "porelo-dist-deb/pool/main/p/porelo-agent-claude/" --flat=true
                  jf rt upload "target/*.cdx.json" "porelo-dist-rpm/${CHANNEL}/" --flat=true

            # Uploaded is not installable.
            - name: The package is indexed, not merely stored
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eu
                  tries=0
                  # -L: Artifactory answers a file with a redirect to its cloud storage, and without it the
                  # body is empty - every package then reads as "not indexed" although it is.
                  while [ "$tries" -lt 20 ]; do
                      if jf rt curl -sL -XGET \
                          "/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" 2>/dev/null \
                          | grep -q "Package: porelo-agent-claude"; then
                          echo "  OK    the Debian index lists porelo-agent-claude"
                          exit 0
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  echo "::error::porelo-agent-claude never appeared in the index - uploaded but not indexed"
                  exit 1

    # The last step, and the only one that installs what an operator installs.
    acceptance:
        name: Acceptance - ${{ matrix.os }}
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        needs: build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))

        strategy:
            fail-fast: false
            # One at a time.
            max-parallel: 1
            matrix:
                os: [ubuntu, fedora]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A release is published only after these legs, so on a tag they install what this run built.
            - name: The packages this run built
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages
                  path: candidate

            # For the Cucumber half, which runs on this runner against the rented machine and needs the JDK.
            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # Before anything is created, so the cleanup below always has something to run.
            - name: Resolve the machine tooling
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt

            # PORELO_E2E_OPENROUTER_API_KEY turns the tier 2 half on.
            - name: Acceptance on ${{ matrix.os }}
              timeout-minutes: 30
              env:
                  HETZNER_API: ${{ secrets.HETZNER_API }}
                  HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
                  PORELO_CI_LEG: acc-${{ matrix.os }}
                  PORELO_E2E_OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
                  # Here rather than a repository setting, so the model is visible and changes with a commit.
                  PORELO_E2E_MODEL: z-ai/glm-5.3-flash
              # '--cucumber' adds the suite in src/acceptance, run from this runner as a person at a terminal,.
              run: |
                  [ -n "${PORELO_E2E_OPENROUTER_API_KEY:-}" ] || { echo "::error::the secret OPEN_ROUTER_API_KEY is empty - the credential scenarios would be skipped and the leg would prove less"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then FROM="--package porelo-agent-claude --candidate candidate"; else FROM="--package porelo-agent-claude"; fi
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main acceptance \
                      --os ${{ matrix.os }} $FROM --cucumber .

            - name: Delete what this run created
              if: always()
              env:
                  HETZNER_API: ${{ secrets.HETZNER_API }}
                  PORELO_CI_LEG: acc-${{ matrix.os }}
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main sweep --mine

    # A release is never replaced and is what people install, so it waits for every job of the run, the legs
    # on rented machines included. A snapshot publishes from the build job, beside a leg still running.
    release:
        name: Publish the release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [build, acceptance]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A tag publishes a release, everything else a snapshot. A release is refused unless the tag is exactly
            # 'v' plus the version it carries and Porelo is a release too, and a version is never both at once.
            - name: Which channel
              id: channel
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  PORELO="$(sed -n 's|^        <porelo.version>\(.*\)</porelo.version>$|\1|p' pom.xml | head -1)"
                  [ -n "$PORELO" ] || { echo "::error::no porelo.version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      case "$PORELO" in
                          *-SNAPSHOT) echo "::error::porelo.version $PORELO is a snapshot; a release is built against a released Porelo"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages
                  path: target

            # The action publishes build-info by itself at the end of the workflow.
            - uses: jfrog/setup-jfrog-cli@1e584506871998c267b7c100c02628a5b9c81db6 # v5.3.0
              with:
                  disable-auto-build-publish: true
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

            # The same two repositories Porelo itself publishes to.
            - name: Publish the packages
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eux
                  # A published release is never replaced, as on Central. Fetched to a file, so an index that
                  # cannot be read stops the release rather than reading as "not published".
                  if [ "$CHANNEL" = releases ]; then
                      curl -sfL -o target/published-index "${JF_URL}/artifactory/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                          || { echo "::error::the release index could not be read, so whether this release is published is unknown"; exit 1; }
                      if grep -qF "Filename: pool/main/p/porelo-agent-claude/$(basename target/*.deb)" target/published-index; then
                          echo "::error::this release is published already"; exit 1
                      fi
                  fi
                  # --flat, or the source directory travels and the package lands away from its siblings.
                  jf rt upload "target/*.deb" "porelo-dist-deb/pool/main/p/porelo-agent-claude/" \
                      --flat=true \
                      --target-props="deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  jf rt upload "target/*.rpm" "porelo-dist-rpm/${CHANNEL}/" --flat=true

                  # The bill beside the package, readable without installing.
                  jf rt upload "target/*.cdx.json" "porelo-dist-deb/pool/main/p/porelo-agent-claude/" --flat=true
                  jf rt upload "target/*.cdx.json" "porelo-dist-rpm/${CHANNEL}/" --flat=true

            # Uploaded is not installable.
            - name: The package is indexed, not merely stored
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eu
                  tries=0
                  # -L: Artifactory answers a file with a redirect to its cloud storage, and without it the
                  # body is empty - every package then reads as "not indexed" although it is.
                  while [ "$tries" -lt 20 ]; do
                      if jf rt curl -sL -XGET \
                          "/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" 2>/dev/null \
                          | grep -q "Package: porelo-agent-claude"; then
                          echo "  OK    the Debian index lists porelo-agent-claude"
                          exit 0
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  echo "::error::porelo-agent-claude never appeared in the index - uploaded but not indexed"
                  exit 1
